<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duel Room</title>
<meta name="theme-color" content="#0e1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duel Room">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script src="room-shim.js"></script>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column built for a phone held in portrait. Home, lobby and game are separate screens. Blue and yellow are the two players and nothing else uses them. */
:root {
  --bg: #eef1fa;
  --surface: #ffffff;
  --cell: #dfe5f7;
  --ink: #13183a;
  --muted: #565e84;
  --line: #c9d1ea;
  --p0: #3a5bff;
  --p1: #ffbf1f;
  --p1text: #8a5f00;
  --good: #0f8f5c;
  --goodink: #ffffff;
  --bad: #c92f46;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1230; --surface: #171d45; --cell: #222a5c; --ink: #eef0ff; --muted: #9aa3d6; --line: #2d3670;
    --p0: #6f86ff; --p1: #ffd04a; --p1text: #ffd04a; --good: #35d28c; --goodink: #06241a; --bad: #ff7a8c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1230; --surface: #171d45; --cell: #222a5c; --ink: #eef0ff; --muted: #9aa3d6; --line: #2d3670;
  --p0: #6f86ff; --p1: #ffd04a; --p1text: #ffd04a; --good: #35d28c; --goodink: #06241a; --bad: #ff7a8c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 460px; margin: 0 auto; }
section { display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--font-display); font-weight: 800; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: 44px; letter-spacing: -0.02em; }
h2 { font-size: 24px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 3px solid var(--p0); outline-offset: 2px; }

.btn {
  font: 700 16px var(--font-body); min-height: 48px; padding: 12px 18px; border-radius: 12px;
  border: 2px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); }
.btn.small { min-height: 40px; padding: 8px 14px; font-size: 14px; }
.btn:disabled { opacity: 0.45; cursor: default; }
input[type="text"] {
  font: 500 17px var(--font-body); width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
}
.codein { font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.3em; text-transform: uppercase; text-align: center; }
.row { display: flex; gap: 10px; align-items: stretch; }
.row > * { min-width: 0; }
.row .codein { flex: 1 1 auto; }
.field { display: flex; flex-direction: column; gap: 6px; }
.panel { background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 2px; background: var(--line); }

.brand { display: flex; align-items: center; gap: 14px; }
.brand svg { width: 64px; height: 40px; flex: none; }
.warn { background: var(--surface); border-left: 5px solid var(--bad); padding: 12px 14px; border-radius: 10px; font-size: 14px; }

.codebox { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.code { font-family: var(--font-mono); font-size: 44px; letter-spacing: 0.22em; line-height: 1; padding-left: 0.22em; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seat { background: var(--surface); border-radius: 14px; padding: 12px 14px; border-bottom: 5px solid var(--line); min-width: 0; }
.seat.p0 { border-bottom-color: var(--p0); }
.seat.p1.filled { border-bottom-color: var(--p1); }
.seat .nm { font-weight: 700; overflow-wrap: anywhere; }
.seat .st { font-size: 13px; color: var(--muted); }
.picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gcard {
  text-align: left; font: inherit; color: inherit; background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
  padding: 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0;
}
.gcard:disabled { opacity: 0.5; cursor: default; }
.gcard:not(:disabled):active { border-color: var(--ink); }
.gcard .t { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.1; }
.gcard .d { font-size: 13px; color: var(--muted); }
.ico { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.topbar .rc { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.18em; color: var(--muted); }
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pl { background: var(--surface); border: 3px solid transparent; border-radius: 14px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.pl.active.p0 { border-color: var(--p0); }
.pl.active.p1 { border-color: var(--p1); }
.pl .who { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; font-size: 14px; }
.pl .who span:last-child { overflow-wrap: anywhere; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.dot.p0 { background: var(--p0); }
.dot.p1 { background: var(--p1); }
.pl .n { font-family: var(--font-display); font-weight: 800; font-size: 32px; font-variant-numeric: tabular-nums; line-height: 1; }
.status { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-align: center; min-height: 30px; text-wrap: balance; }
.status.mine { color: var(--p0); }

.ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cell { aspect-ratio: 1; border: 0; border-radius: 14px; background: var(--cell); display: grid; place-items: center; padding: 0; cursor: pointer; }
.cell svg { width: 62%; height: 62%; fill: none; stroke-width: 3.2; stroke-linecap: round; }
.cell .x { stroke: var(--p0); }
.cell .o { stroke: var(--p1); }
.cell.win { box-shadow: inset 0 0 0 3px var(--ink); }
.c4 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 8px; background: var(--cell); border-radius: 18px; }
.col { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; padding: 0; border: 0; background: none; cursor: pointer; min-width: 0; }
.disc { aspect-ratio: 1; border-radius: 50%; background: var(--bg); }
.disc.p0 { background: var(--p0); }
.disc.p1 { background: var(--p1); }
.disc.win { box-shadow: 0 0 0 3px var(--ink); }

.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pick { font: 700 14px var(--font-body); color: var(--ink); background: var(--surface); border: 3px solid var(--line); border-radius: 16px; padding: 18px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.pick .ico { width: 44px; height: 44px; }
.pick.on { border-color: var(--p0); }
.pick:disabled:not(.on) { opacity: 0.45; cursor: default; }
.reveal { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rv { background: var(--surface); border-radius: 16px; padding: 18px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; border-bottom: 5px solid var(--line); min-width: 0; text-align: center; overflow-wrap: anywhere; }
.rv.p0 { border-bottom-color: var(--p0); }
.rv.p1 { border-bottom-color: var(--p1); }
.rv .ico { width: 64px; height: 64px; }
.rv.won { box-shadow: 0 0 0 3px var(--ink); }

.tapbtn { width: min(100%, 300px); aspect-ratio: 1; margin: 6px auto; border-radius: 50%; border: 0; font-family: var(--font-display); font-weight: 800; font-size: 40px; color: var(--ink); background: var(--cell); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; touch-action: manipulation; padding: 16px; text-align: center; }
.tapbtn small { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--muted); }
.tapbtn.go { background: var(--good); color: var(--goodink); }
.tapbtn.go small { color: var(--goodink); }
.tapbtn.done { background: var(--surface); font-size: 24px; }

.pips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.pip { width: 26px; height: 8px; border-radius: 4px; background: var(--line); }
.pip.now { background: var(--ink); }
.pip.w0 { background: var(--p0); }
.pip.w1 { background: var(--p1); }
.frow { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.frow span:nth-child(2) { flex: 1; min-width: 0; }
.rtc { display: block; margin: 0 auto; touch-action: none; border-radius: 16px; background: var(--cell); }
.tc { text-align: center; }
.pen { display: flex; flex-direction: column; gap: 14px; }
.goal { display: grid; grid-template-columns: repeat(3, 1fr); border: 4px solid var(--ink); border-bottom: 0; border-radius: 14px 14px 0 0; background: var(--cell); min-height: 120px; }
.zone { display: flex; align-items: center; justify-content: center; gap: 8px; border-left: 2px dashed var(--line); min-width: 0; }
.zone:first-child { border-left: 0; }
.ball { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); }
.ball.p0 { background: var(--p0); }
.ball.p1 { background: var(--p1); }
.gk { font: 800 12px var(--font-body); padding: 5px 8px; border-radius: 8px; color: #ffffff; }
.gk.p0 { background: var(--p0); }
.gk.p1 { background: var(--p1); color: #2a2100; }
.zrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.who { display: flex; flex-direction: column; gap: 12px; }
.waitbox { background: var(--surface); border-left: 5px solid var(--p1); padding: 10px 12px; border-radius: 10px; color: var(--ink); }
.wgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.wcard { font: 700 12px var(--font-body); color: var(--ink); background: var(--surface); border: 3px solid var(--line); border-radius: 12px; padding: 4px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; min-width: 0; }
.wcard.sel { border-color: var(--ink); }
.wcard.mine { border-color: var(--p0); }
.wcard.out { opacity: 0.28; }
.face { width: 100%; max-width: 64px; display: block; }
.wbar { display: flex; flex-wrap: wrap; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 700 13px var(--font-body); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
.log { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.log b { font-weight: 700; }
.mine-row { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
.mine-row .face { width: 40px; }
.oddgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.og { aspect-ratio: 1; font: 700 26px var(--font-body); color: var(--ink); background: var(--surface); border: 0; border-radius: 10px; padding: 0; cursor: pointer; }
.og.right { background: var(--good); color: var(--goodink); }
.ctl { display: flex; flex-direction: column; gap: 10px; }
.ctl input[type="range"] { width: 100%; accent-color: var(--ink); height: 32px; }
.meter { position: relative; height: 20px; border-radius: 10px; background: var(--cell); overflow: hidden; }
.meter .fill { height: 100%; width: 0; background: var(--ink); }
.meter .tick { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--good); }
.lane { display: block; width: min(100%, 300px); margin: 0 auto; }
.sv-board { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.sv-hole { fill: var(--cell); stroke: var(--ink); stroke-width: 2; }
.sv-bag { stroke: var(--ink); stroke-width: 1.5; }
.sv-bag.p0 { fill: var(--p0); }
.sv-bag.p1 { fill: var(--p1); }
.sv-bag.miss { opacity: 0.45; }
.sv-lane { fill: var(--surface); }
.sv-gut { fill: var(--cell); }
.sv-pin { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.sv-pin.down { fill: var(--line); stroke: none; }
.sv-ball { fill: var(--ink); }
.sv-path { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 3; }
.mq { font-family: var(--font-display); font-weight: 800; font-size: 48px; text-align: center; padding: 16px 0; font-variant-numeric: tabular-nums; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { font: 800 30px var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface); border: 3px solid var(--line); border-radius: 16px; min-height: 76px; cursor: pointer; }
.opt:disabled:not(.right) { opacity: 0.5; cursor: default; }
.opt.right { background: var(--good); color: var(--goodink); border-color: var(--good); }
#note { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 428px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 20; }
@media (prefers-reduced-motion: no-preference) {
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
}
</style>

<main id="app">
  <section id="home">
    <div class="brand">
      <svg viewBox="0 0 64 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--p0)"/><circle cx="44" cy="20" r="18" fill="var(--p1)" fill-opacity="0.92"/></svg>
      <h1>Duel Room</h1>
    </div>
    <p class="muted">Two phones, one room code, four quick games. Make a room, give your friend the code, and play.</p>
    <div id="homeMsg" class="warn" hidden></div>
    <div class="panel">
      <div class="field">
        <label class="label" for="nick">Your name</label>
        <input id="nick" type="text" maxlength="14" autocomplete="off" placeholder="Player">
      </div>
      <button id="create" class="btn" disabled>Create a room</button>
      <div class="or">or join a friend</div>
      <div class="row">
        <input id="joincode" class="codein" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Room code">
        <button id="join" class="btn ghost" disabled>Join</button>
      </div>
    </div>
    <p id="conn" class="small muted">Connecting…</p>
  </section>

  <section id="joining" hidden>
    <h2>Looking for room <span id="jcode" class="code" style="font-size:28px"></span></h2>
    <p class="muted pulse">Waiting for the host to answer.</p>
    <button id="cancelJoin" class="btn ghost">Cancel</button>
  </section>

  <section id="lobby" hidden>
    <div id="banner1" class="warn" hidden></div>
    <div class="topbar"><span class="label">Room code</span><button id="leave1" class="btn ghost small">Leave</button></div>
    <div class="codebox"><div id="code" class="code"></div><button id="copy" class="btn ghost small">Copy</button></div>
    <div class="seats">
      <div id="seat0" class="seat p0"><div class="nm"></div><div class="st"></div></div>
      <div id="seat1" class="seat p1"><div class="nm"></div><div class="st"></div></div>
    </div>
    <p id="hint" class="muted small"></p>
    <button id="tourbtn" class="btn" disabled>Start 5-game tournament</button>
    <p class="label">Or play one game</p>
    <div id="picker" class="picker"></div>
  </section>

  <section id="game" hidden>
    <div id="banner2" class="warn" hidden></div>
    <div class="topbar"><button id="menu" class="btn ghost small">Games</button><span id="rc" class="rc"></span></div>
    <div id="pips" class="pips" hidden></div>
    <div id="score" class="score"></div>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="body"></div>
    <button id="again" class="btn" hidden></button>
  </section>
</main>
<div id="note" role="status" hidden></div>

    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, pw, ph);
    c.setTransform(s, 0, 0, s, 0, 0);
    c.fillStyle = C.bg; c.fillRect(0, 0, D.W, D.H);
    if (D.flip && seat === 1) { c.translate(D.W, D.H); c.scale(-1, -1); }
    DRAW[g](c, d, C);
    c.setTransform(s, 0, 0, s, 0, 0);
    c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.font = '800 30px "Bricolage Grotesque", sans-serif';
    if (g === 'pong' || g === 'hockey') {
      var me = seat === 1 ? 1 : 0, opp = 1 - me;
      c.fillStyle = me === 0 ? C.p1 : C.p0; c.fillText(String(d.s[opp]), 14, 40);
      c.fillStyle = me === 0 ? C.p0 : C.p1; c.fillText(String(d.s[me]), 14, D.H - 18);
    } else if (g === 'sumo') {
      c.fillStyle = C.p0; c.fillText(String(d.s[0]), 14, 40);
      c.fillStyle = C.p1; c.textAlign = 'right'; c.fillText(String(d.s[1]), D.W - 14, 40);
    }
    if (f.ph === 'ready') {
      c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '800 64px "Bricolage Grotesque", sans-serif'; c.fillStyle = C.ink; c.globalAlpha = 0.85;
      c.fillText(f.cd > 0 ? String(f.cd) : 'Go', D.W / 2, D.H / 2); c.globalAlpha = 1;
    }
  }
  function loop() {
    requestAnimationFrame(loop);
    try {
      if (S.meterEl && S.meterEl.isConnected) S.meterEl.style.width = (meterPower() * 100).toFixed(1) + '%';
      draw();
    } catch (e) {}
  }
  function mathView(st, seat) {
    var m = st.math, box = h('div');
    if (!m.q) { box.append(h('div', { class: 'mq muted pulse', text: 'Ready…' })); return box; }
    box.append(h('div', { class: 'mq', text: m.q + ' = ?' }));
    var g = h('div', { class: 'opts' });
    m.opts.forEach(function (o, i) {
      g.append(h('button', { class: 'opt' + (st.over && i === m.ans ? ' right' : ''), disabled: seat < 0 || st.over, onclick: function () { doAct({ t: 'ans', i: i }); } }, String(o)));
    });
    box.append(g);
    return box;
  }
  function tapView(st, seat) {
    var t = st.tap, label, sub = '';
    if (t.phase === 'wait') { label = 'Wait…'; sub = 'Tap only when it turns green'; }
    else if (t.phase === 'go') { label = 'TAP!'; }
    else label = statusText(st, seat);
    var b = h('button', { class: 'tapbtn ' + t.phase, 'aria-label': 'Tap button', onpointerdown: function (e) { e.preventDefault(); if (seat >= 0) doAct({ t: 'tap' }); }, onclick: function (e) { if (e.detail === 0 && seat >= 0) doAct({ t: 'tap' }); } }, h('span', { text: label }), sub ? h('small', { text: sub }) : null);
    return b;
  }

  /* ---------- wiring ---------- */
  $('nick').value = loadNick();
  $('nick').addEventListener('change', function () { saveNick(clean($('nick').value)); });
  $('create').addEventListener('click', function () { saveNick(clean($('nick').value)); enter(genCode(), true); });
  $('join').addEventListener('click', function () {
    var c = $('joincode').value.trim().toLowerCase();
    if (!/^[a-z0-9]{4}$/.test(c)) { homeMsg('Enter the 4 character room code from your friend’s screen.'); return; }
    saveNick(clean($('nick').value)); enter(c, false);
  });
  $('cancelJoin').addEventListener('click', leaveRoom);
  $('tourbtn').addEventListener('click', function () { doAct({ t: 'tour' }); });
  $('leave1').addEventListener('click', leaveRoom);
  $('menu').addEventListener('click', function () { doAct({ t: 'menu' }); });
  $('again').addEventListener('click', function () { doAct({ t: 'next' }); });
  $('copy').addEventListener('click', function () {
    var done = function () { note('Code ' + S.code.toUpperCase() + ' copied'); };
    try { navigator.clipboard.writeText(S.code.toUpperCase()).then(done, function () { note('Code: ' + S.code.toUpperCase()); }); }
    catch (e) { note('Code: ' + S.code.toUpperCase()); }
  });

  loop();
  (async function () {
    var c = window.claude;
    try { S.room = c && c.use ? await c.use('room') : null; } catch (e) { S.room = null; }
    if (S.room) { $('create').disabled = false; $('join').disabled = false; $('conn').textContent = window.DUEL_APP ? 'Create a room, then share the code with a friend on another phone.' : 'Both players need this page open and Contributor access or higher.'; }
    else { $('conn').textContent = ''; homeMsg('Online rooms are not available in this view. Open the page signed in on claude.ai or in the Claude app.'); }
  })();
})();
</script>
